<style>

  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif; line-height:1.7; -webkit-font-smoothing:antialiased; }

  .facts li::before { content:"·"; margin-right:8px; color:var(--seed); }
  a { color:var(--seed); }
  .support { margin:0 0 20px; }
  .support a { display:inline-block; padding:10px 20px; border:1px solid var(--seed); border-radius:999px; text-decoration:none; font-weight:600; }
  .support a:hover { background:var(--seed); color:var(--canvas); }
  footer { margin-top:64px; padding-top:24px; border-top:1px solid var(--hairline); font-size:13px; color:var(--muted); }
